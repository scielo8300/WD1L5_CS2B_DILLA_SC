<!DOCTYPE html>
<html>
    <head>
        <meta chaerset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title> GroceryKo | Sign Up </title>
        <link rel="stylesheet" href="css/styles.css">

        <script src="js/reg.js" defer></script>
    </head>
    <body>

        <main class="auth-layout">
            <section class="auth-card">
                <a class="brand" href="register.html">
                    Grocery<span>Ko</span>
                </a>
                <p class="eyebrow"> LET'S GET YOU STARTED!</p>
                <h1> Create your account </h1>

                <p class="muted">
                    Sign up to start managing your ggrocery list. 
                </p>

                <!--Registratgion Form-->
                <form id="regForm">
                    <div class="form-field">
                        <label for="full_name"> Full Name </label>
                        <input type="text" id="full_name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-field">
                        <label for="address"> Address </label>
                        <input type="text" id="address" placeholder="Enter your address" required>
                    </div>
                    <div class="form-field">
                        <label for="u_name"> Username </label>
                        <input type="text" id="u_name" placeholder="Enter your username" minlength="10" required>
                    </div>
                    <div class="form-field">
                        <label for="email"> Email </label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-field">
                        <label for="pword"> Password </label>
                        <input type="password" id="pword" placeholder="At least 8 characters" minlength="8" required>
                    </div>
                    <button class="primary-button full-width" type="submit">
                        Create Account
                    </button>

                    <p id="regMessage" class="form-message"></p>
                </form>
                <p class="switch-page">
                    Already have an account?
                    <a href="login.html"> Log In </a>
                </p>
            </section>
        </main>
    </body>
</html>
